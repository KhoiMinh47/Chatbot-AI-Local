[project]
name = "ntc-worker"
version = "0.1.0"
description = "Celery worker entrypoint for the NTC local RAG chatbot"
requires-python = ">=3.14,<3.15"
dependencies = [
  "celery>=5.6,<6",
  "pydantic>=2.13,<3",
  "pydantic-settings>=2.14,<3",
  "docling>=2,<3",
  "docling-core>=2,<3",
  "python-magic>=0.4,<0.5",
  "tiktoken>=0.9,<0.10",
  "langdetect>=1.0,<2",
  "minio>=7.2,<8",
  "onnxruntime>=1.24,<2",
  "openpyxl>=3.1,<4",
  "psycopg[binary]>=3.3,<4",
  "sqlalchemy[asyncio]>=2.0,<3",
  "redis>=8,<9",
  "ntc-shared-python",
]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["worker"]
