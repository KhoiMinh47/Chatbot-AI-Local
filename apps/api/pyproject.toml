[project]
name = "ntc-api"
version = "0.1.0"
description = "FastAPI entrypoint for the NTC local RAG chatbot"
requires-python = ">=3.14,<3.15"
dependencies = [
  "argon2-cffi>=23.1,<24",
  "fastapi>=0.139,<0.140",
  "httpx2>=2,<3",
  # Required at runtime by the Nemotron tokenizer's Jinja chat template.
  "jinja2>=3.1,<4",
  "langgraph>=1.2.9,<1.3",
  "ntc-contracts",
  "ntc-shared-python",
  "pydantic-settings>=2.14,<3",
  "psycopg[binary]>=3.3,<4",
  "pyjwt[cryptography]>=2.10,<3",
  "redis>=8,<9",
  "sqlalchemy[asyncio]>=2.0,<3",
  "transformers>=5.8,<6",
  "uvicorn[standard]>=0.51,<0.52",
  "minio>=7.2,<8",
  "python-magic>=0.4,<0.5",
  "python-multipart>=0.0.20,<1",
  "celery>=5.6,<6",
  "slowapi>=0.1.9,<0.2",
  "aiosmtplib>=3.0,<4",
]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
