      NTC_NIM_EXPECTED_MODEL_ID: ${NIM_RERANK_500M_MODEL:?set NIM_RERANK_500M_MODEL}
      NTC_NIM_ARM64_MANIFEST_DIGEST: ${NIM_RERANK_500M_ARM64_DIGEST:?set NIM_RERANK_500M_ARM64_DIGEST}
      NTC_NIM_CACHE_KEY: llama-nemotron-rerank-500m-v2-nim-1-10-0
      NTC_NIM_HEALTH_PATH: /v1/health/ready
