networks:
  runtime:
    internal: true
  staging:
    internal: false

volumes:
  nim_llama_cache:
  nim_nemotron_cache:
  nim_embed_300m_cache:
  nim_rerank_500m_cache:

secrets:
  ngc_api_key:
    file: ${PHASE3_NGC_API_KEY_FILE:-./.secrets/phase3/ngc_api_key}
