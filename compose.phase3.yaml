      NTC_NIM_ARM64_MANIFEST_DIGEST: ${NIM_LLM_LLAMA_ARM64_DIGEST:?set NIM_LLM_LLAMA_ARM64_DIGEST}
      NTC_NIM_CACHE_KEY: llama-3-1-8b-nim-2-0-6-profile-c4789f7af56c770c1c88b73da666886365534d6980b6b922b41fd97036c77d73
      NTC_NIM_HEALTH_PATH: /v1/health/ready
      NTC_NIM_START_ENTRYPOINT: /opt/nim/start_server.sh
      NTC_NIM_CONTEXT_CAPABILITY_TEST_TARGET: "131072"
      NIM_MODEL_PROFILE: ${NIM_LLM_LLAMA_PROFILE:?set NIM_LLM_LLAMA_PROFILE}
