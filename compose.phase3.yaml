      NTC_NIM_EXPECTED_MODEL_ID: ${NIM_LLM_NEMOTRON_MODEL:?set NIM_LLM_NEMOTRON_MODEL}
      NTC_NIM_ARM64_MANIFEST_DIGEST: ${NIM_LLM_NEMOTRON_ARM64_DIGEST:?set NIM_LLM_NEMOTRON_ARM64_DIGEST}
      NTC_NIM_CACHE_KEY: nemotron-nano-9b-v2-dgx-spark-1-0-0
