[project]
name = "ntc-contracts"
version = "0.1.0"
description = "Versioned Pydantic contracts shared by NTC services"
requires-python = ">=3.14,<3.15"
dependencies = [
  "pydantic>=2.13,<3",
]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ntc_contracts"]

